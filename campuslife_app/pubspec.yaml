name: campuslife_app
description: CampusLife school events and ticketing.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9
  flutter_riverpod: ^3.3.2
  shared_preferences: ^2.5.6
  qr_flutter: ^4.1.0
  fl_chart: ^1.3.0
  video_player: ^2.11.1
  mobile_scanner: ^7.5.0
  share_plus: ^13.3.1
  file_picker: ^13.3.2
  path_provider: ^2.1.6
  url_launcher: ^6.3.3
  intl: ^0.20.2
  drift: 2.34.0
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.34.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    - assets/media/
  fonts:
    - family: OceanMono
      fonts:
        - asset: assets/fonts/CascadiaMono.ttf
          weight: 600
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
